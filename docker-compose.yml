# ============================================
# 星拓 - Docker Compose (使用宿主机现有的 MySQL 和 Redis)
# ============================================

services:
  # ---------- 后端 ----------
  backend:
    build:
      context: ./ai-fusion-video
      dockerfile: Dockerfile
    image: ai-fusion-video:local
    container_name: fusion-backend
    restart: unless-stopped
    # 【新增】映射宿主机网关，允许容器访问宿主机上的服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # ================== 数据库配置 ==================
      MYSQL_HOST: host.docker.internal       # 指向宿主机
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ai_fusion_video        # 数据库名
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: FANAfany1298       # ⚠️ 请修改这里！填入你服务器MySQL的密码
      # ================== Redis配置 ==================
      REDIS_HOST: host.docker.internal       # 指向宿主机
      REDIS_PORT: 6380
      REDIS_PASSWORD: FANAfany1298       # ⚠️ 请修改这里！如果没有密码请留空或删除这行
      # ===============================================
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-sk-placeholder}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    volumes:
      - media_data:/app/data/media

  # ---------- 前端 ----------
  frontend:
    build:
      context: ./ai-fusion-video-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    image: ai-fusion-video-web:local
    container_name: fusion-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
    depends_on:
      - backend

  # ---------- Nginx 反向代理 ----------
  nginx:
    image: nginx:alpine
    container_name: fusion-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8091}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  media_data:
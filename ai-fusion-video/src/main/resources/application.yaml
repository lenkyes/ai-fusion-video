spring:
  application:
    name: ai-fusion-video

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  profiles:
    active: local

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 18080

# 应用配置
app:
  storage:
    local-base-path: ./data/media
  ai:
    # 批量生视频会长时间等待模型队列，需大于单个视频工具的等待时间。
    agent-tool-timeout-minutes: ${AI_AGENT_TOOL_TIMEOUT_MINUTES:130}
  generation:
    video:
      # Agent 工具同步等待生视频任务完成的时间；10 个镜头在单并发队列下通常需要远超 10 分钟。
      agent-tool-wait-timeout-ms: ${VIDEO_AGENT_TOOL_WAIT_TIMEOUT_MS:7200000}

video:
  compose:
    ffmpeg-path: ${VIDEO_COMPOSE_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${VIDEO_COMPOSE_FFPROBE_PATH:ffprobe}
